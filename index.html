<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabela de Preços EFC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: tela teal inteira com faixa amarela na borda direita; logomarca no topo, título amarelo, seletores brancos, R$ ao centro; card branco com o resultado */
:root{
  --teal:#007E7A; --teal-deep:#00625F; --yellow:#ECB112;
  --white:#FFFFFF; --ink:#1F3B3A; --soft:rgba(255,255,255,.78); --faint:rgba(255,255,255,.22);
  --scrim:rgba(0,40,38,.6);
  --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:22px;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--teal);color:var(--white);font-family:var(--sans);display:flex;flex-direction:column;
  padding-right:var(--rail);box-sizing:border-box}
body::after{content:"";position:fixed;top:0;bottom:0;right:0;width:calc(var(--rail) + env(safe-area-inset-right,0px));background:var(--yellow);z-index:1}
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;box-sizing:border-box;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px 28px}
.logo{display:block;width:118px;height:auto}
h1{margin:34px 0 4px;color:var(--yellow);font-size:1.7rem;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:12px}

.sub{margin:0 0 22px;color:var(--soft);font-size:.95rem}
.fields{display:flex;flex-direction:column;gap:6px;padding-left:4px}
label{color:var(--white);font-size:1.15rem;font-weight:500;margin-top:12px;letter-spacing:.01em}
.sel{position:relative}
select{appearance:none;-webkit-appearance:none;width:100%;border:2px solid #E4EAEA;border-radius:10px;background:var(--white);color:var(--ink);
  font:500 1.35rem/1.2 var(--sans);padding:15px 50px 15px 18px;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer}
select:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
select option{color:var(--ink);background:var(--white);font-size:1rem}
.sel::after{content:"";position:absolute;right:20px;top:50%;margin-top:-4px;border:8px solid transparent;border-top:9px solid var(--yellow);border-bottom:0;pointer-events:none}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:10px}
.rs{font-size:clamp(6rem,36vw,12rem);line-height:1;font-weight:600;letter-spacing:-.02em;user-select:none;color:var(--faint)}
.rs span{color:var(--yellow);opacity:.9}
.hint{color:var(--soft);font-size:.95rem;text-align:center;max-width:30ch;margin:0}
footer{color:var(--soft);font-size:.78rem;padding-left:max(28px,env(safe-area-inset-left,0px));padding-block:0 18px;text-align:center;max-width:520px;margin:0 auto;width:100%;box-sizing:border-box}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.dlg{background:var(--white);color:var(--ink);width:100%;max-width:420px;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.35);
  animation:pop .18s ease-out;border-right:10px solid var(--yellow)}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dlg{animation:none}}
.dlg h2{display:flex;align-items:center;gap:12px;margin:0;padding:18px 22px;background:var(--teal);color:var(--white);font-size:1.3rem;font-weight:600}
.coin{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--teal-deep);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.body{padding:16px 22px 8px}
.route{text-transform:uppercase;font-size:1rem;line-height:1.55;font-weight:500}
.route em{font-style:normal;color:var(--teal);font-weight:600}
.km{font-size:.85rem;color:#5B7372;margin-top:2px}
.cls{margin-top:14px;padding-top:12px;border-top:1px solid #E3EAEA}
.cls h3{margin:0 0 4px;font-size:.95rem;font-weight:600;letter-spacing:.08em;color:var(--teal)}
.row{display:flex;justify-content:space-between;font-size:1.1rem;line-height:1.65}
.row b{font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:flex-end;padding:6px 14px 14px}
.ok{background:var(--teal);border:0;color:var(--white);font:600 1rem var(--sans);letter-spacing:.06em;padding:11px 26px;cursor:pointer;border-radius:8px}
.ok:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.warn{font-size:1.05rem;line-height:1.5;margin:0}
</style>
